description: >-
  The words Te Herenga Waka—Victoria University of Wellington actually uses on the interfaces it
  operates itself, plus the institutional terms a reader needs to navigate its surface inventory.
  Derived from the probed contracts; no vendor vocabulary is restated here.
terms:
- term: Te Herenga Waka
  definition: >-
    The university's Māori name, meaning "the hitching post of canoes". It is the institution's
    primary name, not a translation of a secondary one, and it appears in the logo alt text served
    by the global object endpoint.
  source: https://www.wgtn.ac.nz/api/globalobject
- term: global object
  definition: >-
    The university CMS's name for the single JSON document that carries site-wide configuration —
    base URLs, logo manifest, navigation trees, search form contracts and public contacts — consumed
    by every page on www.wgtn.ac.nz.
  source: https://www.wgtn.ac.nz/api/globalobject
- term: baseUrls
  definition: >-
    The set of canonical roots the front end composes links from: mainDomain, intranet, cdnAssets,
    cmsAssets, courses and explore. `courses` and `explore` are the two that matter to an outside
    reader — they name the roots of the public course catalogue and the study-area explorer.
- term: explore
  definition: >-
    The institution's term for its study-area and programme browser, distinct from `courses`, which
    is the per-course-per-year catalogue.
- term: Te Puna Rangahau
  definition: >-
    "The wellspring of research". The Māori name carried by the institution's own repository
    communities — ResearchArchive—Te Puna Rangahau and RestrictedArchive—Te Puna Rangahau — and
    returned as OAI-PMH setNames from ir.wgtn.ac.nz. Note that these are sets in the university's
    SELF-HOSTED DSpace, distinct from the Figshare portal set portal_771 below.
  source: https://ir.wgtn.ac.nz/oai/request?verb=ListSets
- term: ResearchArchive
  definition: >-
    The institution's long-standing name for its own open-access research collection, now a
    community (setSpec com_123456789_1) inside the self-hosted DSpace at ir.wgtn.ac.nz. The legacy
    host researcharchive.vuw.ac.nz now issues an HTTP 302 to Te Waharoa, so the name survives the
    address.
  source: https://ir.wgtn.ac.nz/oai/request?verb=ListSets
- term: RestrictedArchive
  definition: >-
    The embargoed counterpart to ResearchArchive (setSpec com_123456789_1595) — records catalogued
    and OAI-discoverable while their bitstreams remain closed.
  source: https://ir.wgtn.ac.nz/oai/request?verb=ListSets
- term: Stout Literary Archive
  definition: >-
    A distinct repository community (setSpec com_123456789_1605) for the university's New Zealand
    literary holdings, harvestable as its own OAI-PMH set.
  source: https://ir.wgtn.ac.nz/oai/request?verb=ListSets
- term: Orauariki
  definition: >-
    The Māori name of the Wellington School of Business and Government, carried as its own
    repository community (setSpec com_123456789_32325).
  source: https://ir.wgtn.ac.nz/oai/request?verb=ListSets
- term: Signposting
  definition: >-
    FAIR machine-actionable navigation, served by the institution's repository at
    /server/signposting/links/{uuid}: typed link relations — `item` for the bitstream, `describedby`
    for DataCite metadata, `cite-as` for the Handle, `license`, and `linkset` — that let an agent
    traverse from a landing page to the data without scraping HTML.
  source: https://ir.wgtn.ac.nz/server/signposting/links/2c799dae-2a2d-4113-912e-91f8bbf9b46a
- term: Te Waharoa
  definition: >-
    The library's brand for its discovery service. "The gateway". Runs on Ex Libris Primo backed by
    Alma, under the institution's own subdomain tewaharoa.victoria.ac.nz, view VID 64VUW_INST:VUWNUI.
- term: Nuku
  definition: >-
    The institution's brand for its learning-management system, an Instructure Canvas tenant at
    nuku.wgtn.ac.nz.
- term: Rāpoi
  definition: >-
    The university's high-performance computing cluster, also written Raapoi. Slurm-scheduled,
    partitioned, documented publicly by VUW Research Computing. Institution-operated.
- term: Tuakiri
  definition: >-
    The New Zealand Access Federation. The registration authority (https://tuakiri.ac.nz/) that
    signs and republishes the university's SAML identity metadata, and the route by which it reaches
    eduGAIN.
- term: vuw.ac.nz
  definition: >-
    The shibmd:Scope the university's Identity Provider asserts, and one of three registrable
    domains the institution uses. wgtn.ac.nz carries the website, victoria.ac.nz carries library
    discovery, and vuw.ac.nz carries identity and email. All three resolve to the same institution;
    only wgtn.ac.nz was previously recorded.
- term: portal_771
  definition: >-
    The OAI-PMH setSpec that identifies this institution's records inside Figshare's shared
    harvesting endpoint. The set is the institution's; the endpoint is Figshare's.
- term: FIGSHARE.VUW
  definition: >-
    The institution's DataCite repository account symbol, active since 2021-06-10, under which
    4,301 DOIs have been minted for VUW research outputs.
- term: 64VUW_INST
  definition: >-
    The Alma institution code that scopes the library's SRU endpoint and Primo discovery view.
