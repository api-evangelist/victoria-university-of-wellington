- aid: victoria-university-of-wellington:institutional-repository
  name: Institutional Repository (self-hosted DSpace)
  x-operator: institution
  description: >-
    The university's institutional repository, ir.wgtn.ac.nz, running DSpace 7.6.7 on the
    institution's OWN infrastructure: the host sits under its own registrable domain, carries no
    CNAME to any vendor, and resolves directly to 130.195.21.54 inside the university's address
    space, with library-systems@vuw.ac.nz as both the OAI-PMH adminEmail and the OpenSearch
    contact. This is the surface class the university pipeline exists to find and it was missed by
    the previous profile of this institution. It is anonymously callable and keyless across four
    machine-readable interfaces, all verified live on 2026-08-30: an OAI-PMH 2.0 base URL at
    /oai/request carrying 23,150 records in twelve metadata formats across sets that include
    ResearchArchive—Te Puna Rangahau, RestrictedArchive—Te Puna Rangahau, the Stout Literary
    Archive and Exam Papers; a DSpace REST (HAL+JSON) root at /server/api whose communities,
    collections (18) and discovery-search endpoints answer anonymously while /server/api/core/items
    returns HTTP 401; an OpenSearch 1.1 description with an Atom result feed; and FAIR Signposting
    link sets exposing DataCite metadata, Handle cite-as and license relations per item. Operator
    is `institution` rather than `tenant` because the university runs the deployment itself rather
    than buying it as a hosted service — but DSpace's interfaces are open-source and identical
    across every DSpace 7 installation, so the saved contract describes ONLY the endpoints probed
    on this host and credits the university with operating them, never with designing them.
