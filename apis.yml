  name: Enterprise Single Sign-On (WSO2 Identity Server)
  x-operator: institution
  description: >-
    The university self-hosts a WSO2 Identity Server at auth-eis.vuw.ac.nz — no CNAME, resolving
    directly to 130.195.13.55 inside the institution's own address space — and it is the SAML issuer
    that fronts the student records system. Discovered on 2026-08-30 by following the sign-on
    redirect from studentrecords.vuw.ac.nz, which arrives at /samlsso with a signed SAMLRequest and
    RelayState /c/auth/SSB, and returns a login page carrying WSO2's Apache-2.0 copyright header.
