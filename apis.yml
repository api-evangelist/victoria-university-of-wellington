description: >-
  Te Herenga Waka—Victoria University of Wellington is a public research university in Wellington,
  Aotearoa New Zealand, and it operates almost no programmable surface of its own. It publishes no
  developer portal, no API documentation, no API keys, no status page and no changelog. What it has
  instead is what most universities have: a federation of vendor platforms bought under its own
  name, and four surfaces it genuinely runs itself. The four are a self-hosted DSpace 7.6.7
  institutional repository at ir.wgtn.ac.nz — no CNAME, its own address space, 23,150 records
  harvestable over its own keyless OAI-PMH 2.0 base URL in twelve metadata formats, with an
  anonymously readable DSpace REST root, an OpenSearch 1.1 description and FAIR Signposting link
  sets alongside it; an undocumented but public, keyless JSON configuration endpoint on its own
  website (www.wgtn.ac.nz/api/globalobject, HTTP 200, CORS open to all origins); a self-hosted WSO2
  Identity Server at auth-eis.vuw.ac.nz that issues SAML for the student-records system and whose
  every discovery endpoint answers HTTP 403 behind a web application firewall — live and protected,
  not missing; and a SAML 2.0 Shibboleth Identity
  Provider at idp.vuw.ac.nz, entityID
  https://idp.vuw.ac.nz/idp/shibboleth, scope vuw.ac.nz, registered in the Tuakiri New Zealand
  Access Federation since 2012 with the REFEDS Research & Scholarship entity category and a REFEDS
  Sirtfi assurance certification. The repository and the identity federation entry are the
  institution's most durable and most genuinely machine-readable assets, and both are classes of
  interface a university operates by definition rather than by purchase. Everything else
  programmable that carries the university's
  name is a tenancy: the Open Access research repository is a SECOND, Figshare-hosted repository on
  the institution's
  own openaccess.wgtn.ac.nz vanity domain (OAI-PMH set portal_771, DataCite repository FIGSHARE.VUW,
  4,301 DOIs) — the university runs two repositories, one its own and one bought; Te Waharoa library
  discovery is an Ex Libris Primo/Alma deployment on
  tewaharoa.victoria.ac.nz whose SRU 1.2 endpoint is anonymously callable and returns MARCXML; Nuku
  is an Instructure Canvas tenant; the research information system is Symplectic Elements; and
  browser sign-on for student services federates to a Microsoft Entra ID tenant. The data in those
  systems is the university's. The contracts are not, and none of them are saved here. A previous
  profile of this institution attributed Figshare's generic v2 REST API to it as though the
  university had written it; that contract and the sixteen artifacts derived from it have been
  removed. The institution also runs three public GitHub organisations, of which only VUW Research
  Computing — documenting the Rāpoi HPC cluster — is currently active, and it publishes a 12,160-URL
  machine-readable course sitemap covering every course-year page. The registrar surface, where
  student-built course APIs appear at peer institutions, is a self-hosted Ellucian Banner
  Self-Service behind SAML with no public interface at all.
