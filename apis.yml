    one, separate from the Shibboleth IdP used for research federation and from the Microsoft Entra
    ID tenant used for student-facing browser sign-on. Every machine-readable endpoint WSO2
    normally exposes — OIDC discovery, SAML2 metadata, SCIM 2.0 ServiceProviderConfig, the SOAP
    admin services — returns HTTP 403 from a web application firewall that echoes a signature ID and
    the caller's IP. THAT IS A FINDING, NOT AN ABSENCE: the host is live and the endpoints are
    protected, so no conformance is claimed for any of them.
  humanURL: https://www.wgtn.ac.nz/students/tools-and-help
  baseURL: https://auth-eis.vuw.ac.nz/
