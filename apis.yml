    bot challenge, not an outage. FIGSHARE'S GENERIC v2 REST CONTRACT IS DELIBERATELY NOT SAVED IN
    THIS REPOSITORY; it belongs to Figshare, and it was previously attributed here in error. The VUW
    Library did write its own httpd proxy for this set — github.com/VUW-Library/figshare-oaipmh-proxy
    — which is genuine institutional engineering, but it is not publicly deployed at a discoverable
    address.
