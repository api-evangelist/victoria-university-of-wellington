reviews:
  - date: '2026-06-03'
    rating: 2
    summary: >-
      No centralized, branded developer portal exists for Te Herenga
      Waka—Victoria University of Wellington. The verifiable public, machine-
      readable footprint is standards-based scholarly and library
      infrastructure: a Figshare-hosted Open Access repository exposing a live
      OAI-PMH feed (set portal_771) and the public Figshare v2 REST API, plus
      an Ex Libris Primo (Te Waharoa, VID 64VUW_INST:VUWNUI) discovery service
      backed by Alma. Two public GitHub organizations were confirmed
      (victoriauniversity web UI toolkit, VUW-Library engineering). An
      undocumented JSON globalobject endpoint on the main website also responds.
      All endpoints below were probed live; no endpoints were fabricated.
    endpoints:
      - url: https://www.wgtn.ac.nz/
        status: 200
        note: Official university website (Te Herenga Waka).
      - url: https://api.figshare.com/v2/oai?verb=ListIdentifiers&metadataPrefix=oai_dc&set=portal_771
        status: 200
        note: OAI-PMH feed; live, returns VUW article identifiers under portal_771.
      - url: https://api.figshare.com/v2/articles?page_size=1
        status: 200
        note: Public Figshare v2 REST API powering the Open Access repository.
      - url: https://openaccess.wgtn.ac.nz/
        status: 202
        note: Figshare-powered Open Access research repository portal (challenge/JS gate, resolves).
      - url: https://tewaharoa.victoria.ac.nz/discovery/search?vid=64VUW_INST:VUWNUI
        status: 200
        note: Primo (Te Waharoa) discovery search; Alma-backed, VID 64VUW_INST:VUWNUI.
      - url: https://www.wgtn.ac.nz/api/globalobject
        status: 200
        note: Undocumented public JSON CMS config endpoint (baseUrls, logo, nav).
      - url: https://github.com/victoriauniversity
        status: 200
        note: Official GitHub org; web UI kit/styles/toolkit repos.
      - url: https://github.com/VUW-Library
        status: 200
        note: Wellington University Library GitHub org (libguides, DSpace, figshare-oaipmh-proxy).
      - url: https://studentrecords.vuw.ac.nz/
        status: 200
        note: Student records SSO login portal; gated, no public API documented.
      - url: https://www.linkedin.com/school/victoria-university-of-wellington/
        status: 999
        note: LinkedIn school page; 999 is LinkedIn anti-bot, page exists in browser.
  - date: '2026-08-30'
    rating: 2
    summary: >-
      Re-profiled under the API Evangelist university pipeline, whose organising question is who
      OPERATES a surface, not whether a specification exists. The June 2026 review credited "the
      public Figshare v2 REST API" to this institution and a Figshare contract was saved into the
      repository as the university's own; that contract and the fifteen artifacts derived from it
      have been removed, and the Figshare relationship is now recorded as a tenancy instead. Three
      surfaces the institution genuinely operates were confirmed: the undocumented globalobject JSON
      endpoint, a SAML 2.0 Shibboleth Identity Provider registered in the Tuakiri New Zealand Access
      Federation since 2012 (REFEDS R&S, Sirtfi), and a self-hosted WSO2 Identity Server fronting
      student records. Six tenancies were recorded without saving their vendors' contracts: Figshare,
      Ex Libris Primo/Alma, Instructure Canvas, Symplectic Elements, Ellucian Banner and Microsoft
      Entra ID. Two further registrable domains the institution owns — vuw.ac.nz and victoria.ac.nz —
      were registered in the cohort affiliates file; without them, two of its own hosts audited as
      unattributable. Rating held at 2: the correction improves the profile's accuracy, not the
      institution's footprint, which remains genuinely minimal. All endpoints probed live; none
      fabricated.
    endpoints:
      - url: https://www.wgtn.ac.nz/api/globalobject
        status: 200
        note: Institution-operated. Public keyless JSON; CORS open to all origins; JSON body under a text/html Content-Type.
      - url: https://idp.vuw.ac.nz/idp/shibboleth
        status: 200
        note: Institution-operated. SAML 2.0 IdP metadata, entityID https://idp.vuw.ac.nz/idp/shibboleth, scope vuw.ac.nz.
      - url: https://directory.tuakiri.ac.nz/metadata/tuakiri-metadata-signed.xml
        status: 200
        note: Tuakiri signed federation aggregate; carries the VUW entity, registered 2012-06-26, REFEDS R&S + Sirtfi.
      - url: https://auth-eis.vuw.ac.nz/scim2/ServiceProviderConfig
        status: 403
        note: Institution-operated self-hosted WSO2 Identity Server; WAF-blocked. Live and protected, not absent.
      - url: https://studentrecords.vuw.ac.nz/
        status: 200
        note: Tenant. Ellucian Banner Self-Service, self-hosted; redirects into the WSO2 SAML flow. No public API.
      - url: https://tewaharoa.victoria.ac.nz/view/sru/64VUW_INST?version=1.2&operation=searchRetrieve&query=alma.all_for_ui=maori&maximumRecords=2
        status: 200
        note: Tenant. Ex Libris Primo/Alma SRU 1.2, keyless; returned 20,136 matching MARCXML records.
      - url: https://api.figshare.com/v2/oai?verb=ListIdentifiers&metadataPrefix=oai_dc&set=portal_771
        status: 200
        note: Tenant. Figshare's shared OAI-PMH endpoint; the setSpec portal_771 is the institution's, the interface is not.
      - url: https://api.datacite.org/clients/figshare.vuw
