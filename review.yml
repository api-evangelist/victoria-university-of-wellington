      - url: https://nuku.wgtn.ac.nz/api/v1/courses
        status: 401
        note: Tenant. Instructure Canvas REST API; unauthenticated JSON error confirms a live deployment.
      - url: https://elements.wgtn.ac.nz/
        status: 401
        note: Tenant. Symplectic Elements, CNAME vuw.elements.symplectic.org.
      - url: https://login.microsoftonline.com/cfe63e23-6951-427e-8683-bb84dcf1d20c/v2.0/.well-known/openid-configuration
        status: 200
        note: Tenant. The university's Microsoft Entra ID tenant; production browser sign-on.
      - url: https://vuw-research-computing.github.io/raapoi-docs/
